version: "2"
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - dupl
    - errorlint
    - forbidigo
    - goconst
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # math/rand is used here only for cosmetic randomization (sprite/preset
      # selection), not anything security-sensitive, so gosec's weak-RNG
      # warning (G404) doesn't apply.
      - linters:
          - gosec
        path: lib/workflow/preset_actions.go
        text: G404
      # Repeated literals are idiomatic in table-driven tests.
      - linters:
          - goconst
        path: _test\.go
    paths:
      - lib/parser/mapping.go
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(maprandoseedroller)
  exclusions:
    generated: lax
    paths:
      - lib/parser/mapping.go
      - third_party$
      - builtin$
      - examples$
